# La configuración de Kafka, montada entera en vez de por variables de entorno.
#
# **Por qué un fichero y no `KAFKA_*` en el compose.** La imagen oficial trae su
# propio `server.properties` con `advertised.listeners=PLAINTEXT://localhost:9092,
# CONTROLLER://localhost:9093`. Sus variables de entorno lo sobrescriben, pero
# `StorageTool` -que formatea el almacenamiento antes de arrancar- valida la
# configuración ANTES de escribir el fichero final, así que veía el
# `advertised.listeners` de la imagen junto a los `listeners` en 0.0.0.0 y
# rechazaba el arranque:
#
#     advertised.listeners cannot use the nonroutable meta-address 0.0.0.0
#
# El mensaje señala una configuración que ya no existía. Montando el fichero en
# `/mnt/shared/config`, que es donde la imagen busca la config del usuario, no
# hay dos fuentes que mezclar.

node.id=1
process.roles=broker,controller
controller.quorum.voters=1@localhost:9093
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT

# **El CONTROLLER escucha en localhost y no en 0.0.0.0, y eso es lo que
# desbloquea el arranque.** `StorageTool` valida antes de formatear y, para los
# listeners sin `advertised` propio, deriva la dirección anunciada de aquí: con
# CONTROLLER en 0.0.0.0 concluía que se anunciaba una dirección no enrutable y
# abortaba. El CONTROLLER solo habla consigo mismo -es el consenso de un broker
# único-, así que localhost es además lo correcto.
listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
advertised.listeners=PLAINTEXT://localhost:9092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

# Un solo broker: no hay a quién replicar. Los valores por defecto son 3 y el
# arranque falla sin decir claramente por qué.
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0

# Los mensajes caducan a los siete días. Esto es un radar de observaciones
# recientes, no un archivo: lo que hay que conservar acaba en DuckDB, y el log de
# Kafka es solo el camino.
log.retention.hours=168

# La ruta se declara porque la imagen guarda por defecto en /tmp, y ahí el
# volumen no serviría de nada.
log.dirs=/var/lib/kafka/data

num.network.threads=3
num.io.threads=8
num.partitions=1
